<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aaps Hub • Admin Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top left,rgba(139,92,246,.25),transparent 35%),radial-gradient(circle at bottom right,rgba(236,72,153,.18),transparent 35%),#07070b}.box{width:min(420px,100%);padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:25px;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);box-shadow:0 25px 80px #0008}.logo{width:75px;height:75px;margin:0 auto 18px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#3b82f6);font-weight:900}.box h1{text-align:center;font-size:27px}.sub,.owner{text-align:center;color:#999;font-size:13px}.sub{margin:8px 0 5px}.owner{color:#c9b5ff;margin-bottom:28px}.field{margin-bottom:17px}.field label{display:block;margin-bottom:8px;font-size:13px;color:#ddd}.field input{width:100%;padding:14px;border:1px solid #333;border-radius:12px;background:#08080c;color:#fff;outline:none}.field input:focus{border-color:#8b5cf6}.submit{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-weight:800;cursor:pointer}.submit:disabled{opacity:.6}.msg{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#17171f;text-align:center;font-size:12px}.back{display:block;margin-top:22px;text-align:center;color:#999;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">AH</div>
  <h1>Admin Panel</h1>
  <p class="sub">Aaps Hub APK Store</p>
  <p class="owner">Owner Access • Secure Login</p>
  <form id="loginForm">
    <div class="field"><label>Username</label><input id="username" required autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div>
    <button class="submit" id="submit" type="submit">Login to Admin</button>
  </form>
  <div class="msg" id="msg"></div>
  <a class="back" href="/">← Back to Aaps Hub</a>
</div>
<script>
const form=document.getElementById("loginForm"),btn=document.getElementById("submit"),msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{
 e.preventDefault(); btn.disabled=true; btn.textContent="Logging in..."; msg.style.display="none";
 try{
  const r=await fetch("/api/admin/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value.trim(),password:password.value})});
  const d=await r.json(); if(!r.ok) throw new Error(d.message||"Login failed");
  msg.textContent="Login successful..."; msg.style.display="block"; location.href="/admin/";
 }catch(err){msg.textContent="❌ "+err.message;msg.style.display="block";btn.disabled=false;btn.textContent="Login to Admin";}
});
</script>
</body>
</html>
