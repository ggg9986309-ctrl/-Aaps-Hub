<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aaps Hub • Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080c;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.top{height:70px;border-bottom:1px solid #24242d;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.top a,.top button{border:1px solid #333;background:#111;color:#fff;border-radius:9px;padding:9px 12px;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:30px 0}.card{background:#111118;border:1px solid #292933;border-radius:18px;padding:20px}.card h2{margin:0 0 18px;font-size:20px}.field{margin:0 0 14px}.field label{display:block;font-size:12px;color:#aaa;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #333;border-radius:9px;background:#08080c;color:#fff;outline:0}.field textarea{min-height:90px;resize:vertical}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:800;cursor:pointer}.status{font-size:12px;color:#999;margin-top:10px;min-height:18px}.app-row{display:grid;grid-template-columns:55px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #24242d}.app-row:last-child{border-bottom:0}.icon{width:55px;height:55px;border-radius:13px;background:#201936;display:grid;place-items:center;overflow:hidden;color:#a78bfa}.icon img{width:100%;height:100%;object-fit:cover}.meta h3{margin:0 0 5px;font-size:14px}.meta p{margin:0;color:#777;font-size:11px}.actions{display:flex;gap:7px}.actions button{border:1px solid #333;background:#17171e;color:#fff;border-radius:8px;padding:7px 9px;cursor:pointer}.danger{color:#ff8a8a!important}.empty{color:#777;text-align:center;padding:35px 10px}@media(max-width:800px){.grid{grid-template-columns:1fr}.app-row{grid-template-columns:48px 1fr}.actions{grid-column:2}.icon{width:48px;height:48px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Aaps Hub • Admin</div><div><a href="/" target="_blank">View Store</a> <button id="logout">Logout</button></div></div>
  <div class="grid">
    <section class="card">
      <h2>Add APK</h2>
      <form id="uploadForm">
        <div class="field"><label>App name *</label><input name="name" required></div>
        <div class="field"><label>Version *</label><input name="version" value="1.0.0" required></div>
        <div class="field"><label>Category *</label><select name="category" required><option>Games</option><option>Tools</option><option>Social</option><option>Other</option><option>Apps</option></select></div>
        <div class="field"><label>Description</label><textarea name="description"></textarea></div>
        <div class="field"><label>APK *</label><input name="apk" type="file" accept=".apk" required></div>
        <div class="field"><label>Icon (optional)</label><input name="icon" type="file" accept=".png,.jpg,.jpeg,.webp"></div>
        <button class="btn" type="submit">Upload APK</button>
      </form>
      <div class="status" id="status"></div>
    </section>
    <section class="card">
      <h2>Published Apps</h2>
      <div id="list"><div class="empty">Loading...</div></div>
    </section>
  </div>
</div>
<script>
const list=document.getElementById("list"),status=document.getElementById("status"),form=document.getElementById("uploadForm");
async function api(url,opt={}){const r=await fetch(url,{credentials:"include",...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||"Request failed");return d}
async function check(){try{await api("/api/admin/me");load()}catch{location.href="/login"}}
async function load(){try{const d=await api("/api/admin/apps");if(!d.apps.length){list.innerHTML='<div class="empty">No APK added yet.</div>';return}list.innerHTML=d.apps.map(a=>`<div class="app-row"><div class="icon">${a.icon?`<img src="${a.icon}">`:'<span>APK</span>'}</div><div class="meta"><h3>${esc(a.name)}</h3><p>v${esc(a.version)} • ${esc(a.category)} • ${a.downloads||0} downloads</p></div><div class="actions"><button onclick="toggle('${a.id}',${a.published!==false})">${a.published!==false?'Hide':'Publish'}</button><button class="danger" onclick="del('${a.id}')">Delete</button></div></div>`).join("")}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
form.addEventListener("submit",async e=>{e.preventDefault();status.textContent="Uploading...";try{const d=await api("/api/admin/apps",{method:"POST",body:new FormData(form)});status.textContent="✅ "+d.message;form.reset();form.querySelector('[name="version"]').value="1.0.0";load()}catch(e){status.textContent="❌ "+e.message}});
async function toggle(id,published){try{await api("/api/admin/apps/"+encodeURIComponent(id),{method:"PATCH",body:new URLSearchParams({published:String(!published)})});load()}catch(e){alert(e.message)}}
async function del(id){if(!confirm("Delete this APK?"))return;try{await api("/api/admin/apps/"+encodeURIComponent(id),{method:"DELETE"});load()}catch(e){alert(e.message)}}
document.getElementById("logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});location.href="/login"};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
check();
</script>
</body>
</html>
